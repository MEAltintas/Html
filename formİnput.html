<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Anasayfa</title>
</head>

<body>
    <form>
        <input type="text" placeholder="Buraya adınızı giriniz" maxlength="20" autocomplete="on"><br><br>
        <input type="password"><br><br>
        <input type="mail"><br><br>
        <input type="time"><br><br>
        <input type="date"><br><br>
        <input type="file" accept=".png/*, .pdf"><br><br>
        <input type="number" min="0" max="100"><br><br>
        <button>Giriş</button><br><br>
        <input type="color"><br>
        <input type="range"><br>
        <input type="checkbox" id="un" checked="true">MAKU<br>
        <input type="checkbox" id="un">SDU<br>
        <input type="checkbox" id="un">SABANCI<br>
        <input type="checkbox" id="un">KOÇ<br>
        ---------------------------------------------<br>
        <input type="radio" name="un" checked="true">MAKU<br>
        <input type="radio" name="un">SDU<br>
        <input type="radio" name="un">SABANCI<br>
        <input type="radio" name="un">KOÇ<br><br>
        <textarea rows="20" cols="45">
            Altmışlı yıllardan itibaren ‘metin çözümlemesi’ alanında çeşitli yöntemler
            geliştirilmiş; kuramsal yaklaşımlar ve çeşitli metinler üzerinde
            gerçekleştirilen uygulamalar metne yeni açılardan bakılabileceğini
            göstermiştir. Tümce ötesi dil bilim çalışmalarıyla başlayan bu kuramsal
            yaklaşımlardan metindilbilim, kendine özgü araştırma yöntemleri
            geliştirmiştir. Metindilbilimin ‘bağlaşıklık, bağdaşıklık, amaç, durumsallık,
            kabul edilebilirlik, bilgisellik, metinler arası ilişki’ gibi metinsellik ölçütleri
            vardır. Bu ölçütlerden ‘bağlaşıklık’ ve ‘bağdaşıklık’, metindilbilimsel
            incelemelerde ana yapıyı ortaya koymada en çok başvurulan ölçütlerdendir.
            Bağlaşıklık metnin küçük ölçekli yapısıyla yani, ardışık sözceler arasındaki
            dilsel bağıntılar ile ilintiliyken, bağdaşıklık metnin büyük ölçekli yapısıyla
            yani, metindeki sözcelerin anlamsal bir bütünlük içinde algılanmasını
            düzenleyen mantıksal bağıntılar ile ilintilidir</textarea><br>
        <select>
            <option value="1">MAKU</option>
            <option value="2" selected="true">SDU</option>
            <option value="3">SABANCI</option>
            <option value="4">KOÇ</option>
        </select><br><br>
        <fieldset>
            <legend>Kullanıcı Girişi</legend>
            <input type="text" placeholder="Kullanıcı Adı">
            <input type="password" placeholder="Şifre">
            <input type="reset">
            <input type="submit">
        </fieldset>

    </form>
</body>

</html>
